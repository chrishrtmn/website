<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>chrishrtmn.com banners</title>
<style>
  @font-face {
    font-family: 'Schibsted Grotesk';
    src: url('../../public/fonts/schibsted-grotesk-700.woff2') format('woff2');
    font-weight: 700;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('../../public/fonts/geist-mono.woff2') format('woff2');
    font-weight: 100 900;
  }

  :root {
    --volt: #e8ff2e;
    --ink: #121400;
    --night: #111210;
    --offwhite: #f3f1ee;
    --bg: var(--night);
    --fg: var(--offwhite);
    --accent: var(--volt);
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  .safe {
    position: absolute;
    left: var(--safe-x);
    top: var(--safe-y);
    width: var(--safe-w);
    height: var(--safe-h);
    box-sizing: border-box;
    padding: calc(var(--safe-h) * 0.12);
    display: flex;
    align-items: center;
  }

  :root { --u: min(var(--safe-h), var(--safe-w) * 0.38); }

  .mono {
    font-family: 'Geist Mono', monospace;
    font-weight: 500;
    font-size: calc(var(--u) * 0.075);
    letter-spacing: 0.02em;
  }

  .display {
    font-family: 'Schibsted Grotesk', sans-serif;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 0.95;
  }

  .wordmark .safe { align-items: flex-end; }
  .wordmark .stack { display: grid; gap: calc(var(--u) * 0.14); }
  .wordmark img { display: block; height: calc(var(--u) * 0.42); width: auto; margin-left: calc(var(--u) * 0.42 * -0.094); }

  .tagline .safe { justify-content: space-between; gap: calc(var(--safe-h) * 0.1); }
  .tagline .copy { display: grid; gap: calc(var(--safe-h) * 0.08); align-content: center; flex: 1 1 0; min-width: 0; }
  .tagline .rule { width: calc(var(--safe-h) * 0.18); height: calc(var(--safe-h) * 0.025); background: var(--accent); }
  .tagline h1 { margin: 0; font-size: calc(var(--safe-h) * 0.13); }
  .tagline .mono { opacity: 0.8; }
  .tagline img { display: block; height: calc(var(--safe-h) * 0.3); width: auto; flex: none; }

  .inverted { --bg: var(--volt); --fg: var(--ink); --accent: var(--ink); }
  .inverted .safe { align-items: flex-end; }
  .inverted .stack { display: grid; gap: calc(var(--u) * 0.14); }
  .inverted img { display: block; height: calc(var(--u) * 0.42); width: auto; margin-left: calc(var(--u) * 0.42 * -0.094); }

  .card { --bg: var(--volt); --fg: var(--ink); --accent: var(--ink); }
  .card .safe { justify-content: space-between; align-items: flex-end; }
  .card img { display: block; height: calc(var(--u) * 0.42); width: auto; margin-left: calc(var(--u) * 0.42 * -0.094); }
  .card .meta { display: grid; gap: calc(var(--u) * 0.03); justify-items: end; text-align: right; white-space: nowrap; padding-bottom: calc(var(--u) * 0.01); }
  .card .meta .mono { font-size: calc(var(--u) * 0.062); line-height: 1.2; }
  .card .name { font-size: calc(var(--u) * 0.085); letter-spacing: -0.02em; line-height: 1.1; }
  .card .mono { opacity: 0.75; }

  .post { --bg: var(--volt); --fg: var(--ink); --accent: var(--ink); }
  .post .safe { flex-direction: column; align-items: stretch; justify-content: space-between; padding: calc(var(--safe-h) * 0.1); }
  .post .top, .post .bottom { display: flex; justify-content: space-between; align-items: center; }
  .post .mono { font-size: calc(var(--safe-h) * 0.04); opacity: 0.75; }
  .post h1 { margin: 0; font-size: calc(var(--safe-h) * 0.14); text-transform: uppercase; max-width: 15ch; text-wrap: balance; }
  .post img { display: block; height: calc(var(--safe-h) * 0.1); width: auto; }

  /* no avatar overlay: centre the lockup instead of hugging the left */
  .centred .safe { justify-content: center; align-items: center; }
  .centred .stack { justify-items: start; }

  .guides .safe { outline: 2px dashed rgba(255, 0, 128, 0.7); outline-offset: -2px; }
  .guides .avoid {
    position: absolute;
    background: rgba(255, 0, 128, 0.18);
    outline: 2px dashed rgba(255, 0, 128, 0.7);
    outline-offset: -2px;
  }
  .avoid { display: none; }
  .guides .avoid { display: block; }
</style>
</head>
<body>
<div class="avoid" id="avoid"></div>
<main class="safe" id="safe"></main>
<script>
  // size: canvas and the area that stays visible on every device for that platform.
  // avoid: where the platform draws the avatar over the banner.
  const sizes = {
    x:        { w: 1500, h: 500,  safe: [0, 0, 1500, 500],      avoid: [0, 230, 430, 270] },
    bluesky:  { w: 3000, h: 1000, safe: [0, 0, 3000, 1000],     avoid: [0, 460, 860, 540] },
    linkedin: { w: 1584, h: 396,  safe: [0, 0, 1584, 396],      avoid: [0, 150, 480, 246] },
    github:   { w: 1280, h: 640,  safe: [0, 0, 1280, 640] },
    youtube:  { w: 2560, h: 1440, safe: [507, 508, 1546, 423] },
    og:       { w: 1200, h: 630,  safe: [0, 0, 1200, 630] },
  };

  const q = new URLSearchParams(location.search);
  const size = sizes[q.get('size')] ?? sizes.x;
  const dir = q.get('dir') ?? 'wordmark';
  const root = document.documentElement;

  // keep content clear of the avatar: shift the safe box right of the avoid zone on avatar platforms
  let [sx, sy, sw, sh] = size.safe;
  if (size.avoid) {
    const avoidRight = size.avoid[0] + size.avoid[2];
    sx = avoidRight; sw -= avoidRight;
  }
  root.style.setProperty('--safe-x', sx + 'px');
  root.style.setProperty('--safe-y', sy + 'px');
  root.style.setProperty('--safe-w', sw + 'px');
  root.style.setProperty('--safe-h', sh + 'px');

  document.body.classList.add(dir);
  if (q.get('guides')) document.body.classList.add('guides');
  if (!size.avoid && dir !== 'card' && dir !== 'post') document.body.classList.add('centred');

  if (size.avoid) {
    const a = document.getElementById('avoid');
    const [x, y, w, h] = size.avoid;
    Object.assign(a.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
  }

  const brand = '../../public/brand/';
  const url = '<span class="mono">chrishrtmn.com</span>';
  const views = {
    wordmark: `<div class="stack"><img src="${brand}ope-volt.svg" alt="OPE!" />${url}</div>`,
    inverted: `<div class="stack"><img src="${brand}ope-ink.svg" alt="OPE!" />${url}</div>`,
    card: `<img src="${brand}ope-ink.svg" alt="OPE!" /><div class="meta"><div class="display name">Chris Hartman</div><span class="mono">Product engineer</span><span class="mono">northeast Ohio</span></div>`,
    tagline: `<div class="copy"><div class="rule"></div><h1 class="display">Product engineer in northeast Ohio.</h1>${url}</div><img src="${brand}ope-tile.svg" alt="OPE!" />`,
    post: `<div class="top"><span class="mono">posts</span><span class="mono" id="date"></span></div><h1 class="display" id="title"></h1><div class="bottom"><span class="mono">chrishrtmn.com</span><img src="${brand}ope-ink.svg" alt="OPE!" /></div>`,
  };
  document.getElementById('safe').innerHTML = views[dir] ?? views.wordmark;
  // post cards: title and date come from the query string, set as text so nothing is parsed as HTML
  if (dir === 'post') {
    document.getElementById('title').textContent = q.get('title') ?? '';
    document.getElementById('date').textContent = q.get('date') ?? '';
  }
</script>
</body>
</html>
